{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h1 class="mb-4">{{ course.name }}</h1>

    <div class="card">
        <div class="card-header">
            <h3>Lessons</h3>
        </div>

        <div class="card-body">
            {% for lesson in course.lesson_set.all %}
                <div class="mb-3">
                    <h5>{{ lesson.title }}</h5>
                    <p>{{ lesson.content }}</p>
                </div>
            {% empty %}
                <p>No lessons available for this course.</p>
            {% endfor %}
        </div>
    </div>

</div>

{% endblock %}
